name: Build BERU Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: BERU AI
            app_id: com.beru.ai
            start_url: https://houssem028.github.io/beru-ai/
            artifact_name: BERU-AI-APK
            output_name: BERU-AI-debug.apk
          - app_name: BERU ADMIN
            app_id: com.beru.admin
            start_url: https://houssem028.github.io/beru-ai/admin.html
            artifact_name: BERU-ADMIN-APK
            output_name: BERU-ADMIN-debug.apk

    steps:
      - name: Check out BERU AI source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app web files and Capacitor dependencies
        env:
          APP_NAME: ${{ matrix.app_name }}
          APP_ID: ${{ matrix.app_id }}
          START_URL: ${{ matrix.start_url }}
        run: |
          mkdir -p www
          npm init -y
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capgo/capacitor-social-login@^8 esbuild sharp
          if [ "$APP_ID" = "com.beru.ai" ]; then
            cp index.html script.js style.css www/
            cp -R assets www/assets
            ICON_SOURCE="assets/images/beru-pwa.svg"
          else
            mkdir -p www/assets/images
            cp assets/images/beru-admin-icon.svg www/assets/images/beru-admin-icon.svg
            ICON_SOURCE="assets/images/beru-admin-icon.svg"
          fi
          if [ "$APP_ID" = "com.beru.ai" ]; then
            cat > native-entry.js <<'EOF'
          import { SocialLogin } from '@capgo/capacitor-social-login';

          let initializationError = null;
          try {
            await SocialLogin.initialize({
              google: {
                // Use the Web OAuth client ID as required by Google Credential Manager.
                webClientId: '1029198003465-bs891ka49b1j2a1rm5m60cnog5vtalm3.apps.googleusercontent.com',
                skipAuthOnlyAuthorizationAfterSignIn: true
              }
            });
          } catch (error) {
            initializationError = error;
            console.error('BERU native Google initialization failed:', error);
          }

          window.BeruNativeGoogleSignIn = async () => {
            if (initializationError) throw initializationError;
            const login = await SocialLogin.login({ provider: 'google', options: { filterByAuthorizedAccounts: false, style: 'standard' } });
            const idToken = login?.result?.idToken;
            if (!idToken) throw new Error('Google did not return an ID token.');
            return idToken;
          };

          await import('./script.js');
          EOF
            npx esbuild native-entry.js --bundle --format=esm --outfile=www/native-entry.js
            sed -i 's#<script src="script.js"></script>#<script type="module" src="native-entry.js"></script>#' www/index.html
          else
            printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Opening BERU ADMIN…</body></html>' > www/index.html
          fi
          node -e 'const fs=require("fs");const c={appId:process.env.APP_ID,appName:process.env.APP_NAME,webDir:"www"};if(process.env.APP_ID==="com.beru.admin" && process.env.START_URL)c.server={url:process.env.START_URL,cleartext:false,androidScheme:"https"};if(process.env.APP_ID==="com.beru.ai")c.plugins={SocialLogin:{providers:{google:true,facebook:false,apple:false,twitter:false},logLevel:1}};fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2))'
          npx cap add android
          node - "$ICON_SOURCE" <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const source = process.argv[2];
          const output = path.join('android','app','src','main','res');
          (async () => {
            const svg = fs.readFileSync(source);
            const sizes = { mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192 };
            for (const [density,size] of Object.entries(sizes)) {
              const dir = path.join(output,'mipmap-' + density);
              fs.mkdirSync(dir,{recursive:true});
              await sharp(svg).resize(size,size).png().toFile(path.join(dir,'ic_launcher.png'));
              await sharp(svg).resize(size,size).png().toFile(path.join(dir,'ic_launcher_round.png'));
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          if [ "$APP_ID" = "com.beru.ai" ]; then
            PACKAGE_PATH=$(echo "$APP_ID" | tr '.' '/')
            mkdir -p "android/app/src/main/java/$PACKAGE_PATH"
            cat > "android/app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
          package $APP_ID;

          import android.content.Intent;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {
            @Override
            public void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN &&
                  requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                PluginHandle handle = getBridge().getPlugin("SocialLogin");
                if (handle == null) {
                  Log.i("BERU Google Login", "SocialLogin plugin handle is null");
                  return;
                }
                Plugin plugin = handle.getInstance();
                if (plugin instanceof SocialLoginPlugin) {
                  ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                }
              }
            }

            @Override
            public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF
          fi
          npx cap sync android

      - name: Restore stable Android debug signing key
        env:
          BERU_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.BERU_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$BERU_ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$BERU_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.output_name }}"

      - name: Show Android debug SHA-1 for OAuth setup
        if: matrix.app_id == 'com.beru.ai'
        run: |
          echo "BERU AI Android package: com.beru.ai"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error
          retention-days: 14
