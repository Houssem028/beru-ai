<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BERU Icon Converter</title>
<style>
body{font-family:system-ui;background:#100b20;color:#fff;margin:0;padding:24px}
main{max-width:760px;margin:auto}
h1{color:#d9b5ff}
.card{background:#211735;border:1px solid #60438b;border-radius:18px;padding:18px;margin:18px 0}
img{width:180px;height:180px;object-fit:contain;background:#fff;border-radius:12px;display:block;margin:12px auto}
button{background:#7c3aed;color:white;border:0;border-radius:10px;padding:12px 16px;margin:5px;font-weight:700}
small{color:#d4c5e8}
</style>
</head>
<body><main>
<h1>BERU — تحويل الأيقونات الأصلية إلى PNG</h1>
<p>هذه الأداة تحوّل نفس الصور الموجودة في مستودعك إلى PNG دون إعادة تصميم أو تغيير الألوان أو قص الصورة.</p>
<section class="card">
<h2>BERU AI</h2><img id="pwa" alt="BERU AI">
<button onclick="save('pwa',192)">تحميل PNG 192×192</button>
<button onclick="save('pwa',512)">تحميل PNG 512×512</button>
</section>
<section class="card">
<h2>BERU ADMIN</h2><img id="admin" alt="BERU ADMIN">
<button onclick="save('admin',192)">تحميل PNG 192×192</button>
<button onclick="save('admin',512)">تحميل PNG 512×512</button>
</section>
<small>ملاحظة: الملفات الأصلية في المستودع محتواها JPEG رغم أن امتدادها .svg؛ الأداة تقرأ الصورة كما هي وتصدر PNG.</small>
</main>
<script>
const sources={
 pwa:"../assets/beru-pwa.svg",
 admin:"../assets/images/beru-admin-icon.svg"
};
const loaded={};
function load(key){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{loaded[key]=img;document.getElementById(key).src=img.src;resolve(img)};
  img.onerror=reject;img.src=sources[key];
 });
}
async function save(key,size){
 const img=loaded[key]||await load(key);
 const canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;
 const ctx=canvas.getContext("2d");
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 ctx.drawImage(img,0,0,size,size);
 canvas.toBlob(blob=>{
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=(key==="pwa"?"beru-pwa":"beru-admin-icon")+"-"+size+".png";
  a.click();URL.revokeObjectURL(url);
 },"image/png");
}
load("pwa").catch(()=>document.getElementById("pwa").alt="تعذر تحميل الصورة");
load("admin").catch(()=>document.getElementById("admin").alt="تعذر تحميل الصورة");
</script></body></html>
